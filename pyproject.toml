[project]
name = "sumo-traffic-simulation"
version = "1.0.0"
description = "SUMO Traffic Simulation with FastAPI server for real-time monitoring and control"
readme = "README.md"
requires-python = ">=3.8"
dependencies = [
    "fastapi>=0.104.0",
    "uvicorn>=0.24.0",
    "pydantic>=2.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
only-include = [
    "sumo_api_server.py",
    "traffic_monitor.py",
    "*.xml",
    "*.sumocfg",
    "*.netecfg",
]

[tool.uv]
dev-dependencies = []
package = false
